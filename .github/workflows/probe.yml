name: Check new brand sites
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Site addresses, separated by spaces"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scraper.py --probe ${{ inputs.urls }}
