name: Refresh products and publish site

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the latest files, so a rebuild never uses older data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests beautifulsoup4

      - name: Scrape
        if: github.event_name != 'push'
        run: python scraper.py

      - name: Rebuild site data (uploads only, no scraping)
        if: github.event_name == 'push'
        run: python scraper.py --renormalise

      - name: Save updated data to the repo
        if: github.event_name != 'push'
        run: |
          git config user.name "product-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -q -f --ignore-unmatch docs/listings.json docs/listings.csv
          git add data/listings.json.gz
          git diff --cached --quiet || git commit -m "Refresh products $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs   # in case files were uploaded while this ran
          git push

      - name: Attach spreadsheet of all products (download from this run's page)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: products-spreadsheet
          path: data/listings.csv
          retention-days: 7

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
