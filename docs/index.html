<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethnic wear from India's best brands, in one place</title>
<meta name="description" content="Kurta sets, co-ords, kurtas and more from Jaipur Handblock, Label Kanupriya, Zlaata and other brands, in one place. Filter by category, price, size, colour and discount.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  :root {
    --ink: #14172B; --muted: #4A4F63; --soft: #5A5F73; --line: #E3E5EE; --field: #C9CCD8;
    --bg: #FFFFFF; --tint: #F5F6FA; --accent: #2B3A8C; --accent-dark: #1A2566; --badge: #F2B632;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  a { color: var(--accent); } a:hover { color: var(--accent-dark); }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px; }

  header { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 10; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px; padding-top: 14px; padding-bottom: 14px; }
  .logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.02em; color: var(--ink); text-decoration: none; }
  nav { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 15px; font-weight: 500; }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 0; color: var(--muted); cursor: pointer; min-height: 44px; }
  nav button[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
  .search { flex: 1 1 260px; display: flex; justify-content: flex-end; }
  .search input { width: 100%; max-width: 380px; height: 44px; border: 1px solid var(--field); border-radius: 22px; padding: 0 18px; background: var(--tint); font-size: 15px; }

  main { padding: 28px 0 64px; display: flex; flex-direction: column; gap: 24px; }
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  h1 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .tools label { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
  select { height: 44px; border: 1px solid var(--field); border-radius: 10px; padding: 0 12px; font-size: 14px; background: var(--bg); }
  .filter-toggle { display: none; height: 44px; padding: 0 18px; border: 1px solid var(--accent); border-radius: 22px; background: var(--bg); color: var(--accent); font-weight: 600; cursor: pointer; }

  .layout { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px; }
  aside { flex: 1 1 240px; max-width: 100%; display: flex; flex-direction: column; gap: 20px; }
  .results { flex: 999 1 560px; min-width: 0; }
  .ftop { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
  .ftop h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .linkbtn { background: none; border: 0; color: var(--accent); font-size: 14px; font-weight: 500; cursor: pointer; min-height: 44px; padding: 0 4px; }
  fieldset { border: 0; margin: 0; padding: 0 0 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  legend { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0 0 8px; }
  .opt { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 15px; cursor: pointer; }
  .opt input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }
  .opt .n { margin-left: auto; color: var(--soft); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
  /* sizes: wrapping pills that grow with their label and never overlap */
  .sizes { display: flex; flex-wrap: wrap; gap: 8px; }
  .sizes .opt { position: relative; flex: 0 0 auto; max-width: 100%; min-width: 52px; min-height: 40px; padding: 0 14px;
    justify-content: center; border: 1px solid var(--field); border-radius: 20px; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .sizes .opt span { overflow: hidden; text-overflow: ellipsis; }
  .sizes .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .sizes .opt:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sizes .opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sizes .opt:hover { border-color: var(--accent); }
  .bq { height: 40px; border: 1px solid var(--field); border-radius: 10px; padding: 0 12px; margin-bottom: 6px; font-size: 14px; background: var(--tint); }
  #bmore { align-self: flex-start; padding: 0; }
  .note { margin: 6px 0 0; font-size: 12px; line-height: 1.5; color: var(--soft); }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #9A9EB0; flex: none; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 32px 20px; }
  .card { display: flex; flex-direction: column; gap: 6px; }
  .img { position: relative; aspect-ratio: 3 / 4; background: #EEF0F6; border-radius: 12px; overflow: hidden; display: block; }
  .img img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
  .img .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--soft); }
  .badge { z-index: 2; position: absolute; top: 10px; left: 10px; background: var(--badge); color: var(--ink); font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; }
  .oos { z-index: 2; position: absolute; left: 10px; right: 10px; bottom: 10px; text-align: center; background: rgba(20,23,43,0.85); color: #fff; font-size: 12px; font-weight: 600; padding: 6px; border-radius: 6px; }
  .card.sold .img img { opacity: 0.55; }
  .src { margin-top: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
  .card h3 { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card h3 a { color: var(--ink); text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .price strong { font-size: 17px; font-weight: 600; }
  .price s { font-size: 14px; color: var(--soft); }
  .price .off { font-size: 13px; font-weight: 600; color: #A8410C; }
  .meta { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--soft); }
  .meta .dot { width: 12px; height: 12px; }
  .go { margin-top: 6px; display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid var(--accent); border-radius: 22px; font-size: 14px; font-weight: 600; text-decoration: none; }
  .go:hover { background: var(--accent); color: #fff; }
  .more { display: flex; justify-content: center; margin-top: 36px; }
  .more button { min-height: 48px; padding: 0 28px; border-radius: 24px; border: 0; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  .empty { border: 1px dashed var(--field); border-radius: 16px; padding: 48px 24px; text-align: center; }
  .empty p { margin: 0 0 12px; font-size: 17px; font-weight: 600; }
  footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--soft); font-size: 13px; line-height: 1.6; }

  @media (max-width: 860px) {
    .filter-toggle { display: inline-flex; align-items: center; }
    aside { display: none; flex-basis: 100%; }
    aside.open { display: flex; }
    h1 { font-size: 32px; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 16px; }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px; }
    .card h3 { font-size: 14px; }
    .go { font-size: 13px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="logo" href="./" id="logo">[SITE NAME]</a>
    <div class="search"><input type="search" id="q" aria-label="Search products" placeholder="Search styles, fabrics, brands…"></div>
  </div>
</header>

<div class="wrap">
<main>
  <div class="head">
    <div>
      <h1 id="title">Loading…</h1>
      <p class="sub" id="sub"></p>
      <p class="sub" id="loading" hidden>Loading all styles… filters and counts will update in a moment.</p>
    </div>
    <div class="tools">
      <button type="button" class="filter-toggle" id="ftoggle" aria-expanded="false" aria-controls="filters">Filters</button>
      <label>Sort by
        <select id="sort">
          <option value="rel" selected hidden>Select</option>
          <option value="lo">Price: low to high</option>
          <option value="hi">Price: high to low</option>
          <option value="disc">Biggest discount</option>
        </select>
      </label>
    </div>
  </div>

  <div class="layout">
    <aside id="filters" aria-label="Filters">
      <div class="ftop"><h2>Filters</h2><button type="button" class="linkbtn" id="clear" hidden>Clear all</button></div>
      <fieldset><legend>Category</legend><div id="f-cat"></div></fieldset>
      <fieldset><legend>Brand</legend>
        <input type="search" id="bq" class="bq" aria-label="Search brands" placeholder="Search brands">
        <div id="f-brand"></div>
        <button type="button" class="linkbtn" id="bmore" hidden>Show all brands</button>
      </fieldset>
      <fieldset><legend>Price</legend><div id="f-price"></div></fieldset>
      <fieldset><legend>Discount</legend><div id="f-disc"></div></fieldset>
      <fieldset><legend>Size</legend><div class="sizes" id="f-size"></div><p class="note" id="size-note"></p></fieldset>
      <fieldset><legend>Colour</legend><div class="grid2" id="f-colour"></div></fieldset>
      <label class="opt"><input type="checkbox" id="stock" checked> In stock only</label>
    </aside>
    <section class="results" aria-label="Products">
      <div class="cards" id="cards"></div>
      <div class="more" id="more" hidden><button type="button">Show more</button></div>
    </section>
  </div>
</main>
</div>

<footer>
  <div class="wrap">
    <span id="updated"></span>
    Prices and stock are refreshed every few hours. Always check the final price on the brand's site.
  </div>
</footer>

<script>
/* ------------------------------------------------------------------
   SETTINGS - edit these
------------------------------------------------------------------- */
const SITE_NAME = "[SITE NAME]";
// Order the categories appear in the filter (must match the scraper's names)
const CATEGORY_ORDER = ["Kurta sets", "Co-ord sets", "Kurtas", "Dresses", "Tops & shirts", "Bottoms",
  "Lehengas", "Sarees", "Jackets & overlays", "Nightwear & loungewear", "Menswear", "Kidswear", "Accessories", "Other"];
const PAGE_SIZE = 48;
// When you get affiliate links, wrap product URLs here, e.g.
// return "https://your-network.example/track?url=" + encodeURIComponent(url);
function outLink(url, product) { return url; }

const COLOUR_HEX = {
  Black: "#1B1B1F", White: "#FFFFFF", Beige: "#E8D9BC", Brown: "#7B4A2D", Red: "#C62828",
  Maroon: "#7A1F2B", Pink: "#E58FAE", Orange: "#F08A3C", Yellow: "#E8B931", Green: "#2E7D4F",
  Blue: "#2F4A9E", Purple: "#6B3FA0", Grey: "#9096A3", Gold: "#C9A23F",
  Multicolour: "conic-gradient(#E58FAE, #E8B931, #2E7D4F, #2F4A9E, #6B3FA0, #E58FAE)", Other: "#EEF0F6"
};
const SIZE_ORDER = ["XXS", "XS", "S", "M", "L", "XL", "XXL", "3XL", "4XL", "5XL", "6XL", "7XL", "8XL", "Free size"];
const BUST = { 30: "XXS", 32: "XXS", 34: "XS", 36: "S", 38: "M", 40: "L", 42: "XL", 44: "XXL", 46: "3XL", 48: "4XL", 50: "5XL", 52: "6XL", 54: "7XL", 56: "8XL" };
// "S (36)", "S - 36", "SMALL", "36" -> "S"; "Set of 3", "Unstitched" -> not a size
function normSize(raw) {
  const t = String(raw).toUpperCase().replace(/[^A-Z0-9]+/g, " ").trim();
  if (!t) return null;
  if (/\bFREE\b|\bONE SIZE\b|\bFS\b|\bFREESIZE\b/.test(t)) return "Free size";
  if (/\bSET\b|STITCH|\bYRS?\b|\bYEARS?\b|\bMONTHS?\b|\bKIDS?\b/.test(t)) return null;
  let m = t.match(/\b([2-8])\s?XL\b/); if (m) return m[1] === "2" ? "XXL" : m[1] + "XL";
  m = t.match(/\b(X{3,8})L\b/); if (m) return m[1].length + "XL";
  const words = [[/\bXXL\b|\bXX L\b|\bDOUBLE XL\b/, "XXL"], [/\bXL\b|\bEXTRA LARGE\b|\bX LARGE\b/, "XL"], [/\bXXS\b/, "XXS"],
    [/\bXS\b|\bEXTRA SMALL\b|\bX SMALL\b/, "XS"], [/\bS\b|\bSMALL\b/, "S"], [/\bM\b|\bMEDIUM\b/, "M"], [/\bL\b|\bLARGE\b/, "L"]];
  for (const [rx, z] of words) if (rx.test(t)) return z;
  m = t.match(/\b(\d{2})\b/); if (m && BUST[+m[1]]) return BUST[+m[1]];
  return null;
}
const normSizes = list => [...new Set(list.map(normSize).filter(Boolean))].sort((a, b) => SIZE_ORDER.indexOf(a) - SIZE_ORDER.indexOf(b));
const PRICE_BUCKETS = [
  { k: "all", label: "Any price", test: () => true },
  { k: "u1000", label: "Under ₹1,000", test: p => p.price < 1000 },
  { k: "1000", label: "₹1,000 – ₹1,999", test: p => p.price >= 1000 && p.price < 2000 },
  { k: "2000", label: "₹2,000 – ₹2,999", test: p => p.price >= 2000 && p.price < 3000 },
  { k: "3000", label: "₹3,000 and above", test: p => p.price >= 3000 }
];
const DISCOUNTS = [[0, "Any discount"], [20, "20% off or more"], [40, "40% off or more"], [60, "60% off or more"]];

/* ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";
const rs = n => "₹" + Math.round(n).toLocaleString("en-IN");
const split = s => (s || "").split("|").map(x => x.trim()).filter(Boolean);

let ALL = [];
const st = { cats: new Set(), brands: new Set(), price: "all", disc: 0, sizes: new Set(), colours: new Set(), stock: true, q: "", sort: "rel", shown: PAGE_SIZE, bq: "", allBrands: false };

function sizeKey(z) { const i = SIZE_ORDER.indexOf(z); return i < 0 ? 999 : i; }

// Shopify images can be resized by the CDN: ask for ~500px instead of full size
function imgUrl(u) {
  if (!u) return "";
  if (u.startsWith("//")) u = "https:" + u;
  if (/\/cdn\/shop\/|cdn\.shopify\.com/.test(u) && !/[?&]width=/.test(u)) u += (u.includes("?") ? "&" : "?") + "width=500";
  return u;
}

function finish(p, i) {
  p.i = i;
  p.disc = p.mrp > p.price ? Math.round((p.mrp - p.price) / p.mrp * 100) : 0;
  p.q = (p.title + " " + p.source + " " + p.colour + " " + p.category).toLowerCase();
  return p;
}

function parseCompact(d) {
  return d.p.map(([si, ci, title, url, price, mrp, co, mask, stock, image], i) => {
    const src = d.sources[si];
    const sizes = [];
    for (let k = 0; k < d.sizes.length; k++) if (mask & (1 << k)) sizes.push(d.sizes[k]);
    return finish({ source: src.n, category: d.cats[ci], title, url: url.startsWith("http") ? url : src.b + url,
      price, mrp: mrp || price, colour: d.colours[co] || "Other", sizes, inStock: stock === 1, image: imgUrl(image) }, i);
  });
}

function showUpdated(u) {
  if (u) $("updated").textContent = "Last updated " + new Date(u).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }) + ". ";
}

async function load() {
  $("logo").textContent = SITE_NAME;
  const opts = { cache: "no-cache" };  // reuse the browser's copy unless the file changed
  const full = fetch("products.json", opts).then(r => r.ok ? r.json() : null).catch(() => null);
  let started = false;
  const start = list => {
    ALL = list;
    if (!started) {
      started = true;
      const pre = new URLSearchParams(location.search).get("category");  // ?category=Kurta%20sets
      if (pre && ALL.some(p => p.category === pre)) st.cats.add(pre);
      bind();
    }
    render();
  };
  try {
    // 1) small first part: shows products straight away
    const first = await fetch("products-first.json", opts).then(r => r.ok ? r.json() : null).catch(() => null);
    if (first && first.p.length) {
      start(parseCompact(first));
      showUpdated(first.updated);
      if (first.total > first.p.length) $("loading").hidden = false;
    }
    // 2) everything
    const d = await full;
    if (d) { start(parseCompact(d)); showUpdated(d.updated); }
    else if (!started) throw new Error("no product file");
  } catch (e) {
    if (!started) { $("title").textContent = "Couldn't load products"; $("sub").textContent = "The product file is missing or unreadable."; }
  }
  $("loading").hidden = true;
}

function resetFilters() {
  st.cats.clear(); st.brands.clear(); st.sizes.clear(); st.colours.clear();
  st.price = "all"; st.disc = 0; st.q = ""; $("q").value = ""; st.bq = ""; st.shown = PAGE_SIZE;
  render();
}

function bind() {
  let t;
  $("q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value; st.shown = PAGE_SIZE; render(); }, 150); });
  $("sort").addEventListener("change", e => { st.sort = e.target.value; render(); });
  $("stock").addEventListener("change", e => { st.stock = e.target.checked; st.shown = PAGE_SIZE; render(); });
  $("clear").addEventListener("click", () => { st.stock = true; $("stock").checked = true; st.sort = "rel"; $("sort").value = "rel"; resetFilters(); });
  $("more").querySelector("button").addEventListener("click", () => { st.shown += PAGE_SIZE; render(false); });
  $("ftoggle").addEventListener("click", () => {
    const open = $("filters").classList.toggle("open");
    $("ftoggle").setAttribute("aria-expanded", open);
  });
  $("bq").addEventListener("input", e => { st.bq = e.target.value; renderBrands(); });
  $("bmore").addEventListener("click", () => { st.allBrands = !st.allBrands; renderBrands(); });
  $("filters").addEventListener("change", e => {
    const tg = e.target, v = tg.value;
    const sets = { category: st.cats, brand: st.brands, size: st.sizes, colour: st.colours };
    if (sets[tg.name]) { tg.checked ? sets[tg.name].add(v) : sets[tg.name].delete(v); }
    else if (tg.name === "price") st.price = v;
    else if (tg.name === "disc") st.disc = +v;
    else return;
    st.shown = PAGE_SIZE; render();
  });
}

// One pass over all products: builds the result list AND the counts shown next to
// every filter option (each count respects all the *other* active filters).
let LIST = [], COUNTS = {}, NOSIZE = new Set();
function compute() {
  const priceOk = PRICE_BUCKETS.find(b => b.k === st.price).test;
  const words = st.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const C = { category: {}, brand: {}, size: {}, colour: {} };
  const list = [], nosize = new Set();
  const add = (g, v) => { C[g][v] = (C[g][v] || 0) + 1; };
  for (const p of ALL) {
    if (st.stock && !p.inStock) continue;
    if (words.length && !words.every(w => p.q.includes(w))) continue;
    let fails = 0, failed = "";
    if (st.cats.size && !st.cats.has(p.category)) { fails++; failed = "category"; }
    if (st.brands.size && !st.brands.has(p.source)) { fails++; failed = "brand"; }
    if (!priceOk(p)) { fails++; failed = "price"; }
    if (p.disc < st.disc) { fails++; failed = "disc"; }
    if (st.sizes.size && !p.sizes.some(z => st.sizes.has(z))) { fails++; failed = "size"; }
    if (st.colours.size && !st.colours.has(p.colour)) { fails++; failed = "colour"; }
    if (fails > 1) continue;
    if (fails === 0) {
      list.push(p);
      add("category", p.category); add("brand", p.source); add("colour", p.colour);
      for (const z of p.sizes) add("size", z);
      if (!p.sizes.length) nosize.add(p.source);
    } else if (failed === "category") add("category", p.category);
    else if (failed === "brand") add("brand", p.source);
    else if (failed === "colour") add("colour", p.colour);
    else if (failed === "size") { for (const z of p.sizes) add("size", z); if (!p.sizes.length) nosize.add(p.source); }
  }
  LIST = list; COUNTS = C; NOSIZE = nosize;
}

function opt(type, name, value, label, n, checked, extra = "") {
  return `<label class="opt" title="${esc(label)}"><input type="${type}" name="${name}" value="${esc(value)}"${checked ? " checked" : ""}>${extra}<span>${esc(label)}</span>${n !== null ? `<span class="n">${n.toLocaleString("en-IN")}</span>` : ""}</label>`;
}

// options with results, plus anything already ticked (so it can be unticked)
const shownKeys = (counts, selected, order) => {
  const keys = new Set([...Object.keys(counts), ...selected]);
  return order ? [...order.filter(k => keys.has(k)), ...[...keys].filter(k => !order.includes(k))] : [...keys];
};

const BRAND_PREVIEW = 8;
function renderBrands() {
  const bc = COUNTS.brand || {};
  const q = st.bq.trim().toLowerCase();
  let brands = shownKeys(bc, st.brands).sort((a, b) => (st.brands.has(b) - st.brands.has(a)) || (bc[b] || 0) - (bc[a] || 0) || a.localeCompare(b));
  if (q) brands = brands.filter(b => b.toLowerCase().includes(q));
  const total = brands.length;
  const show = q || st.allBrands ? brands : brands.slice(0, BRAND_PREVIEW);
  $("f-brand").innerHTML = show.map(b => opt("checkbox", "brand", b, b, bc[b] || 0, st.brands.has(b))).join("") || '<span class="note">No brand matches</span>';
  $("bmore").hidden = !!q || total <= BRAND_PREVIEW;
  $("bmore").textContent = st.allBrands ? "Show fewer" : `Show all ${total} brands`;
}

function renderFilters() {
  const C = COUNTS;
  $("f-cat").innerHTML = shownKeys(C.category, st.cats, CATEGORY_ORDER).map(c => opt("checkbox", "category", c, c, C.category[c] || 0, st.cats.has(c))).join("");
  renderBrands();
  $("f-price").innerHTML = PRICE_BUCKETS.map(b => opt("radio", "price", b.k, b.label, null, st.price === b.k)).join("");
  $("f-disc").innerHTML = DISCOUNTS.map(([v, l]) => opt("radio", "disc", v, l, null, st.disc === v)).join("");
  $("f-size").innerHTML = shownKeys(C.size, st.sizes, SIZE_ORDER).map(z => opt("checkbox", "size", z, z, null, st.sizes.has(z))).join("") || '<span class="note">No size data</span>';
  const ns = [...NOSIZE];
  $("size-note").textContent = ns.length ? (ns.length <= 3 ? ns.join(", ") : `${ns.length} brands`) + " list sizes only on their own site for some items, so those are hidden when you pick a size." : "";
  $("f-colour").innerHTML = shownKeys(C.colour, st.colours, Object.keys(COLOUR_HEX)).map(c => opt("checkbox", "colour", c, c, C.colour[c] || 0, st.colours.has(c),
    `<span class="dot" aria-hidden="true" style="background:${COLOUR_HEX[c] || COLOUR_HEX.Other}"></span>`)).join("");
  const active = st.cats.size + st.brands.size + st.sizes.size + st.colours.size + (st.price !== "all") + (st.disc > 0) + (st.q.trim() ? 1 : 0);
  $("clear").hidden = !active;
  $("clear").textContent = `Clear all (${active})`;
  $("ftoggle").textContent = active ? `Filters (${active})` : "Filters";
}

function card(p) {
  const url = safeUrl(outLink(p.url, p));
  return `<article class="card${p.inStock ? "" : " sold"}">
    <a class="img" href="${esc(url)}" target="_blank" rel="noopener sponsored" tabindex="-1" aria-hidden="true">
      <span class="ph">${esc(p.source)}</span>
      ${p.image ? `<img src="${esc(safeUrl(p.image))}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ""}
      ${p.disc > 0 ? `<span class="badge">${p.disc}% off</span>` : ""}
      ${p.inStock ? "" : '<span class="oos">Out of stock</span>'}
    </a>
    <span class="src">${esc(p.source)}</span>
    <h3><a href="${esc(url)}" target="_blank" rel="noopener sponsored">${esc(p.title)}</a></h3>
    <div class="price"><strong>${rs(p.price)}</strong>${p.disc > 0 ? `<s>${rs(p.mrp)}</s><span class="off">${p.disc}% off</span>` : ""}</div>
    <span class="meta"><span class="dot" aria-hidden="true" style="background:${COLOUR_HEX[p.colour] || COLOUR_HEX.Other}"></span>${esc(p.colour)}</span>
    <span class="meta">${p.sizes.length ? "Sizes: " + esc(p.sizes.join(" · ")) : "Sizes on brand site"}</span>
    <a class="go" href="${esc(url)}" target="_blank" rel="noopener sponsored">View on ${esc(p.source)}</a>
  </article>`;
}

function render(recompute = true) {
  if (recompute) {
    compute();
    renderFilters();
    const by = { lo: (a, b) => a.price - b.price, hi: (a, b) => b.price - a.price, disc: (a, b) => b.disc - a.disc, rel: (a, b) => a.i - b.i };
    LIST.sort((a, b) => (b.inStock - a.inStock) || by[st.sort](a, b));
  }
  const list = LIST;
  const sel = CATEGORY_ORDER.filter(c => st.cats.has(c)).concat([...st.cats].filter(c => !CATEGORY_ORDER.includes(c)));
  const label = !sel.length ? "All styles" : sel.length <= 2 ? sel.join(" & ") : `${sel.length} categories`;
  $("title").textContent = label;
  document.title = `${label} | ${SITE_NAME}`;
  const nb = new Set(list.map(p => p.source)).size;
  $("sub").textContent = `${list.length.toLocaleString("en-IN")} ${list.length === 1 ? "style" : "styles"} from ${nb} ${nb === 1 ? "brand" : "brands"}`;
  $("cards").innerHTML = list.length
    ? list.slice(0, st.shown).map(card).join("")
    : `<div class="empty"><p>Nothing matches these filters</p><button type="button" class="linkbtn" onclick="document.getElementById('clear').click()">Clear filters</button></div>`;
  $("cards").style.display = list.length ? "" : "block";
  $("more").hidden = list.length <= st.shown;
}

load();
</script>
</body>
</html>
